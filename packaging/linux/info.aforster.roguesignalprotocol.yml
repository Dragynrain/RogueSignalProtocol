# Rogue Signal Protocol - Coffee break cyberspace stealth roguelike
# https://github.com/Dragynrain/RogueSignalProtocol
#
# This is a PyInstaller-bundled Python game (not buildable from source in Flatpak).
# The binary bundles Python runtime + native libraries (SDL2, libtcod, numpy).
# See flathub.json for architecture limitation explanation.

app-id: info.aforster.roguesignalprotocol
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: rogue-signal-protocol

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=all  # Gamepad/controller + GPU access (input device type needs newer flatpak)

modules:
  - name: RogueSignalProtocol
    # Using 'simple' buildsystem: this is a pre-built PyInstaller binary.
    # No source compilation possible - Python and all dependencies are bundled.
    buildsystem: simple
    build-commands:
      # Install game binary and assets
      - install -dm755 /app/lib/rogue-signal-protocol
      - install -dm755 /app/bin
      - install -Dm755 RogueSignalProtocol /app/lib/rogue-signal-protocol/
      - cp -r graphics sound music /app/lib/rogue-signal-protocol/
      - install -Dm644 game_content.json game_rules.json graphics_tiles.json narrative_content.json default_bindings.json KreativeSquare.ttf -t /app/lib/rogue-signal-protocol/
      - test -f README.txt && install -Dm644 README.txt /app/lib/rogue-signal-protocol/ || true
      - test -f debug_mode.flag && install -Dm644 debug_mode.flag /app/lib/rogue-signal-protocol/ || true

      # Wrapper script (cd's to game dir before exec - required for asset loading)
      # Source: https://github.com/Dragynrain/RogueSignalProtocol/blob/main/packaging/linux/rogue-signal-protocol
      - install -Dm755 rogue-signal-protocol /app/bin/

      # Install desktop integration. Use 'install -D -t DIR' (creates the target
      # directory) rather than a trailing-slash DEST, which fails when the dir does
      # not already exist. The icon line names a full DEST path, so it is fine.
      - install -Dm644 info.aforster.roguesignalprotocol.desktop -t /app/share/applications/
      - install -Dm644 logo-256.png /app/share/icons/hicolor/256x256/apps/info.aforster.roguesignalprotocol.png
      - install -Dm644 info.aforster.roguesignalprotocol.metainfo.xml -t /app/share/metainfo/

      # License
      - install -dm755 /app/share/licenses/info.aforster.roguesignalprotocol
      - test -f LICENSE && install -Dm644 LICENSE /app/share/licenses/info.aforster.roguesignalprotocol/ || true

    sources:
      - type: archive
        url: https://github.com/Dragynrain/RogueSignalProtocol/releases/download/v1.0.0/RogueSignalProtocol-1.0.0-Linux.tar.gz
        sha256: eb105a3243dd44e4ffb1e840541de902cdfd9279a60af22fd27f141165b23b78
        # Tarball has all files at the root (no wrapping dir); default strip of 1
        # would delete them, so keep all path components.
        strip-components: 0

      # Support files pinned to an immutable commit (not the mutable main branch),
      # each with a sha256, as Flathub requires.
      - type: file
        url: https://raw.githubusercontent.com/Dragynrain/RogueSignalProtocol/b96cd69670e7538f920c98e22c4fe3c98783ee6f/packaging/linux/logo-256.png
        sha256: 5f753961c3550168d1fead02ad18cf6178f7ef24f35e4c39f9000d7f9d26fe5c
        dest-filename: logo-256.png

      - type: file
        url: https://raw.githubusercontent.com/Dragynrain/RogueSignalProtocol/b96cd69670e7538f920c98e22c4fe3c98783ee6f/packaging/linux/info.aforster.roguesignalprotocol.desktop
        sha256: 38a93a9195bf497b186c4e8f9c492325f29054ee5a234446e17b227dbb2c2313
        dest-filename: info.aforster.roguesignalprotocol.desktop

      - type: file
        url: https://raw.githubusercontent.com/Dragynrain/RogueSignalProtocol/b96cd69670e7538f920c98e22c4fe3c98783ee6f/packaging/linux/info.aforster.roguesignalprotocol.metainfo.xml
        sha256: 8b5b36a79e0ab1ad0cdf0722726719b98dfd2afbef02338c84914638aafc5bbf
        dest-filename: info.aforster.roguesignalprotocol.metainfo.xml

      - type: file
        url: https://raw.githubusercontent.com/Dragynrain/RogueSignalProtocol/b96cd69670e7538f920c98e22c4fe3c98783ee6f/packaging/linux/rogue-signal-protocol
        sha256: 8ed1bf0b28347e27dc77a279228fc7b728afd63dc085953a4d1b46ed2bcf32fb
        dest-filename: rogue-signal-protocol
