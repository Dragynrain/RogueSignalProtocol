[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | releases
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "releases",
]

[tool.ruff.lint]
# Enable common linting rules
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "N802",  # Function name should be lowercase (intentional for config properties)
    "N806",  # Variable in function should be lowercase (intentional for Win32 API constants)
]

[tool.ruff.lint.per-file-ignores]
# Test files often have unused variables for documentation/clarity
"tests/**/*.py" = ["F841", "E731"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten later
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Exclude directories (use simpler patterns for Windows)
exclude = '''(?x)(
    ^build
    | ^dist
    | ^releases
    | ^\.venv
)'''

# Per-module options (can add specific modules to be stricter)
[[tool.mypy.overrides]]
module = "tcod.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pygame.*"
ignore_missing_imports = true
