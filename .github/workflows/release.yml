name: Build Release

# Run when a new release is created, or manually via workflow_dispatch
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (alpha/beta/release)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - beta
          - alpha
      version:
        description: 'Version number (e.g., 0.9.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true  # Enable Git LFS for large asset files

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Verify required files
      run: |
        # Check that all required files exist
        $missing = @()

        if (-not (Test-Path "RogueSignalProtocol.py")) { $missing += "RogueSignalProtocol.py" }
        if (-not (Test-Path "requirements.txt")) { $missing += "requirements.txt" }
        if (-not (Test-Path "game_content.json")) { $missing += "game_content.json" }
        if (-not (Test-Path "game_rules.json")) { $missing += "game_rules.json" }
        if (-not (Test-Path "graphics_tiles.json")) { $missing += "graphics_tiles.json" }
        if (-not (Test-Path "narrative_content.json")) { $missing += "narrative_content.json" }
        if (-not (Test-Path "default_bindings.json")) { $missing += "default_bindings.json" }
        if (-not (Test-Path "KreativeSquare.ttf")) { $missing += "KreativeSquare.ttf" }
        if (-not (Test-Path "graphics")) { $missing += "graphics/" }
        if (-not (Test-Path "sound")) { $missing += "sound/" }
        if (-not (Test-Path "music")) { $missing += "music/" }

        if ($missing.Count -gt 0) {
          Write-Error "Missing required files: $($missing -join ', ')"
          exit 1
        }

        Write-Host "All required files found."
      shell: powershell

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run tests
      run: |
        # Run full test suite on Linux/Windows to catch platform-specific issues
        # Pre-commit already runs tests locally, but this tests on different OS
        # Use --no-cov to skip coverage (already enforced by pre-commit hook)
        python -m pytest tests/ -v --tb=short --no-cov -x
      shell: powershell

    - name: Build executable with PyInstaller
      run: |
        # Use spec file for consistent build settings with local builds
        pyinstaller --clean RogueSignalProtocol.spec

        # Determine build type (from workflow_dispatch input or default to release)
        $buildType = "${{ github.event.inputs.build_type }}"
        if (-not $buildType) { $buildType = "release" }

        # Create debug_mode.flag for alpha/beta builds (enables DEBUG logging)
        # Release builds have no flag = minimal logging
        if ($buildType -ne "release") {
          Write-Host "Creating debug_mode.flag for $buildType build..."
          "Debug mode enabled for $buildType build" | Out-File -FilePath "dist\debug_mode.flag" -Encoding ASCII
        } else {
          Write-Host "Release build - no debug_mode.flag (minimal logging)"
        }
      shell: powershell

    - name: Verify executable was created
      run: |
        if (-not (Test-Path "dist\RogueSignalProtocol.exe")) {
          Write-Error "Build failed - executable not found!"
          exit 1
        }
        Write-Host "Executable created successfully."
      shell: powershell

    - name: Copy assets to dist
      run: |
        # Copy JSON config files
        Write-Host "Copying JSON config files..."
        Copy-Item -Path "game_content.json" -Destination "dist\"
        Copy-Item -Path "game_rules.json" -Destination "dist\"
        Copy-Item -Path "graphics_tiles.json" -Destination "dist\"
        Copy-Item -Path "narrative_content.json" -Destination "dist\"
        Copy-Item -Path "default_bindings.json" -Destination "dist\"

        # Copy font file
        Write-Host "Copying font file..."
        Copy-Item -Path "KreativeSquare.ttf" -Destination "dist\"

        # Copy logo for desktop integration
        Write-Host "Copying logo..."
        Copy-Item -Path "logo.png" -Destination "dist\"

        # Copy LICENSE if it exists
        if (Test-Path "LICENSE") {
          Write-Host "Copying LICENSE..."
          Copy-Item -Path "LICENSE" -Destination "dist\"
        }

        # Copy README
        Write-Host "Copying distribution README..."
        Copy-Item -Path "README.txt" -Destination "dist\README.txt"

        # Create build info
        Write-Host "Creating build info..."
        $buildType = "${{ github.event.inputs.build_type }}"
        if (-not $buildType) { $buildType = "release" }
        if ($buildType -eq "release") { $logLevel = "WARNING" } else { $logLevel = "DEBUG" }
        "Build Type: $buildType (GitHub Actions)" | Out-File -FilePath "dist\build_info.txt" -Encoding ASCII
        "Log Level: $logLevel" | Add-Content -Path "dist\build_info.txt"
        "Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Add-Content -Path "dist\build_info.txt"

        # Copy asset folders
        Write-Host "Copying graphics folder..."
        Copy-Item -Path "graphics" -Destination "dist\graphics" -Recurse

        Write-Host "Copying sound folder..."
        Copy-Item -Path "sound" -Destination "dist\sound" -Recurse

        Write-Host "Copying music folder..."
        Copy-Item -Path "music" -Destination "dist\music" -Recurse

        Write-Host "All assets copied successfully."
      shell: powershell

    - name: Smoke test (run the built binary)
      run: |
        # Launch the assembled binary headlessly to catch packaging breakage the
        # source test suite cannot - e.g. a PyInstaller spec that fails to bundle
        # the rsp package. The exe chdir's to its own dir, so dist/ assets are found.
        dist\RogueSignalProtocol.exe --self-test
        if ($LASTEXITCODE -ne 0) { Write-Error "Self-test failed (exit $LASTEXITCODE)"; exit 1 }
        Write-Host "Self-test passed."
      shell: powershell

    - name: Validate package structure
      run: |
        # Verify all critical files are present in dist/
        $required = @(
          "dist\RogueSignalProtocol.exe",
          "dist\game_content.json",
          "dist\game_rules.json",
          "dist\narrative_content.json",
          "dist\graphics_tiles.json",
          "dist\default_bindings.json",
          "dist\KreativeSquare.ttf",
          "dist\graphics",
          "dist\sound",
          "dist\music"
        )

        $missing = @()
        foreach ($path in $required) {
          if (-not (Test-Path $path)) {
            $missing += $path
          }
        }

        if ($missing.Count -gt 0) {
          Write-Error "Package validation failed! Missing: $($missing -join ', ')"
          exit 1
        }

        # Check executable size is reasonable (should be > 10MB with dependencies)
        $exeSize = (Get-Item "dist\RogueSignalProtocol.exe").Length / 1MB
        if ($exeSize -lt 10) {
          Write-Warning "Executable seems small ($([math]::Round($exeSize, 2)) MB) - may be missing dependencies"
        }

        Write-Host "Package validation passed - all required files present"
        Write-Host "Executable size: $([math]::Round($exeSize, 2)) MB"
      shell: powershell

    - name: Create release archive
      run: |
        # Get version from release tag or workflow input
        $version = "${{ github.event.inputs.version }}"
        if (-not $version) {
          # Extract from release tag (strips leading 'v' if present)
          $version = "${{ github.ref_name }}" -replace '^v', ''
        }

        $zipName = "RogueSignalProtocol-$version-Windows.zip"
        Write-Host "Creating archive: $zipName"

        Compress-Archive -Path dist\* -DestinationPath $zipName -Force

        # Verify zip was created
        if (-not (Test-Path $zipName)) {
          Write-Error "Failed to create release archive!"
          exit 1
        }

        $zipSize = (Get-Item $zipName).Length / 1MB
        Write-Host "Release archive created: $([math]::Round($zipSize, 2)) MB"

        # Save filename for upload step
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
      shell: powershell

    - name: Upload release asset
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'release'
      with:
        files: ${{ env.ZIP_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifact (for workflow_dispatch)
      uses: actions/upload-artifact@v4
      if: github.event_name == 'workflow_dispatch'
      with:
        name: windows-build
        path: ${{ env.ZIP_NAME }}

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev xvfb

    - name: Verify required files
      run: |
        missing=""
        [ ! -f "RogueSignalProtocol.py" ] && missing="$missing RogueSignalProtocol.py"
        [ ! -f "requirements.txt" ] && missing="$missing requirements.txt"
        [ ! -f "game_content.json" ] && missing="$missing game_content.json"
        [ ! -f "game_rules.json" ] && missing="$missing game_rules.json"
        [ ! -f "graphics_tiles.json" ] && missing="$missing graphics_tiles.json"
        [ ! -f "narrative_content.json" ] && missing="$missing narrative_content.json"
        [ ! -f "default_bindings.json" ] && missing="$missing default_bindings.json"
        [ ! -f "KreativeSquare.ttf" ] && missing="$missing KreativeSquare.ttf"
        [ ! -d "graphics" ] && missing="$missing graphics/"
        [ ! -d "sound" ] && missing="$missing sound/"
        [ ! -d "music" ] && missing="$missing music/"

        if [ -n "$missing" ]; then
          echo "Missing required files:$missing"
          exit 1
        fi
        echo "All required files found."

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run tests
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
      run: |
        # Run full test suite on Linux to catch platform-specific issues.
        # Headless runner: use dummy SDL drivers and a virtual framebuffer (xvfb)
        # so SDL/libtcod video init succeeds. Matches ci.yml; without this the
        # gamepad end-to-end tests fail with "Could not initialize SDL: No
        # available video device".
        xvfb-run -a python -m pytest tests/ -v --tb=short --no-cov -x

    - name: Build executable with PyInstaller
      run: |
        pyinstaller RogueSignalProtocol-linux.spec

        # Determine build type (from workflow_dispatch input or default to release)
        BUILD_TYPE="${{ github.event.inputs.build_type }}"
        if [ -z "$BUILD_TYPE" ]; then BUILD_TYPE="release"; fi

        # Create debug_mode.flag for alpha/beta builds (enables DEBUG logging)
        # Release builds have no flag = minimal logging
        if [ "$BUILD_TYPE" != "release" ]; then
          echo "Creating debug_mode.flag for $BUILD_TYPE build..."
          echo "Debug mode enabled for $BUILD_TYPE build" > dist/debug_mode.flag
        else
          echo "Release build - no debug_mode.flag (minimal logging)"
        fi

    - name: Verify executable was created
      run: |
        if [ ! -f "dist/RogueSignalProtocol" ]; then
          echo "Build failed - executable not found!"
          exit 1
        fi
        chmod +x dist/RogueSignalProtocol
        echo "Executable created successfully."

    - name: Copy assets to dist
      run: |
        # Copy JSON config files
        echo "Copying JSON config files..."
        cp game_content.json dist/
        cp game_rules.json dist/
        cp graphics_tiles.json dist/
        cp narrative_content.json dist/
        cp default_bindings.json dist/

        # Copy font file
        echo "Copying font file..."
        cp KreativeSquare.ttf dist/

        # Copy LICENSE if it exists
        if [ -f "LICENSE" ]; then
          echo "Copying LICENSE..."
          cp LICENSE dist/
        fi

        # Copy README
        echo "Copying distribution README..."
        cp README.txt dist/README.txt

        # Create build info
        echo "Creating build info..."
        BUILD_TYPE="${{ github.event.inputs.build_type }}"
        if [ -z "$BUILD_TYPE" ]; then BUILD_TYPE="release"; fi
        if [ "$BUILD_TYPE" = "release" ]; then LOG_LEVEL="WARNING"; else LOG_LEVEL="DEBUG"; fi
        echo "Build Type: $BUILD_TYPE (GitHub Actions - Linux)" > dist/build_info.txt
        echo "Log Level: $LOG_LEVEL" >> dist/build_info.txt
        echo "Build Date: $(date '+%Y-%m-%d %H:%M:%S')" >> dist/build_info.txt

        # Copy asset folders
        echo "Copying graphics folder..."
        cp -r graphics dist/

        echo "Copying sound folder..."
        cp -r sound dist/

        echo "Copying music folder..."
        cp -r music dist/

        # Copy logo for Linux desktop integration
        echo "Copying logo..."
        cp logo.png dist/

        # Copy Flatpak/desktop integration files for Flathub builds
        echo "Copying desktop integration files..."
        cp packaging/linux/info.aforster.roguesignalprotocol.desktop dist/
        cp packaging/linux/info.aforster.roguesignalprotocol.metainfo.xml dist/

        echo "All assets copied successfully."

    - name: Smoke test (run the built binary)
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
      run: |
        # Launch the assembled binary headlessly to catch packaging breakage the
        # source test suite cannot - e.g. a PyInstaller spec that fails to bundle
        # the rsp package (which shipped a broken 1.0.0 Linux build). The binary
        # chdir's to its own dir, so dist/ assets are found.
        cd dist
        ./RogueSignalProtocol --self-test || { echo "Self-test failed"; exit 1; }
        echo "Self-test passed."

    - name: Validate package structure
      run: |
        # Verify all critical files are present in dist/
        required=(
          "dist/RogueSignalProtocol"
          "dist/game_content.json"
          "dist/game_rules.json"
          "dist/narrative_content.json"
          "dist/graphics_tiles.json"
          "dist/default_bindings.json"
          "dist/KreativeSquare.ttf"
          "dist/graphics"
          "dist/sound"
          "dist/music"
        )

        missing=""
        for path in "${required[@]}"; do
          if [ ! -e "$path" ]; then
            missing="$missing $path"
          fi
        done

        if [ -n "$missing" ]; then
          echo "Package validation failed! Missing:$missing"
          exit 1
        fi

        # Check executable size is reasonable (should be > 10MB with dependencies)
        exe_size=$(stat -c%s "dist/RogueSignalProtocol")
        exe_mb=$((exe_size / 1048576))
        if [ $exe_mb -lt 10 ]; then
          echo "Warning: Executable seems small (${exe_mb} MB) - may be missing dependencies"
        fi

        echo "Package validation passed - all required files present"
        echo "Executable size: ${exe_mb} MB"

    - name: Create release archive
      run: |
        # Get version from workflow input or release tag (strips leading 'v' if present)
        VERSION="${{ github.event.inputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION="${GITHUB_REF_NAME#v}"
        fi

        TARBALL="RogueSignalProtocol-${VERSION}-Linux.tar.gz"
        echo "Creating tarball: $TARBALL"

        cd dist
        tar -czvf "../$TARBALL" *
        cd ..

        if [ ! -f "$TARBALL" ]; then
          echo "Failed to create release archive!"
          exit 1
        fi

        size=$(du -h "$TARBALL" | cut -f1)
        echo "Release archive created: $size"

        # Save filename and version for upload steps
        echo "TARBALL_NAME=$TARBALL" >> $GITHUB_ENV
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Build AppImage
      run: |
        # Use version from previous step (already in env)
        VERSION="${{ env.VERSION }}"
        echo "Building AppImage version: $VERSION"

        # Create AppDir structure
        APPDIR="AppDir"
        mkdir -p "$APPDIR/usr/bin"
        mkdir -p "$APPDIR/usr/share/applications"
        mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"
        mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
        mkdir -p "$APPDIR/usr/share/icons/hicolor/128x128/apps"
        mkdir -p "$APPDIR/usr/share/metainfo"

        # Copy executable and all game files
        cp -r dist/* "$APPDIR/usr/bin/"
        chmod +x "$APPDIR/usr/bin/RogueSignalProtocol"

        # Copy icon
        cp logo.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/rogue-signal-protocol.png"
        cp logo.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/rogue-signal-protocol.png"
        cp logo.png "$APPDIR/usr/share/icons/hicolor/128x128/apps/rogue-signal-protocol.png"

        # Create desktop entry
        cat > "$APPDIR/usr/share/applications/rogue-signal-protocol.desktop" << 'EOF'
        [Desktop Entry]
        Name=Rogue Signal Protocol
        GenericName=Roguelike Game
        Comment=Cyberpunk roguelike game
        Exec=RogueSignalProtocol
        Icon=rogue-signal-protocol
        Terminal=false
        Type=Application
        Categories=Game;RolePlaying;
        Keywords=roguelike;cyberpunk;tactical;turn-based;
        EOF

        # Create AppStream metainfo
        cat > "$APPDIR/usr/share/metainfo/com.dragynrain.roguesignalprotocol.appdata.xml" << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <component type="desktop-application">
          <id>com.dragynrain.roguesignalprotocol</id>
          <name>Rogue Signal Protocol</name>
          <summary>Cyberpunk roguelike game</summary>
          <metadata_license>MIT</metadata_license>
          <project_license>MIT</project_license>
          <description>
            <p>Rogue Signal Protocol is a tactical cyberpunk roguelike.</p>
          </description>
          <launchable type="desktop-id">rogue-signal-protocol.desktop</launchable>
          <provides>
            <binary>RogueSignalProtocol</binary>
          </provides>
          <releases>
            <release version="$VERSION" date="$(date +%Y-%m-%d)"/>
          </releases>
        </component>
        EOF

        # Create AppRun script (wrapper that sets working directory)
        cat > "$APPDIR/AppRun" << 'EOF'
        #!/bin/bash
        SELF=$(readlink -f "$0")
        HERE=${SELF%/*}
        cd "$HERE/usr/bin"
        exec ./RogueSignalProtocol "$@"
        EOF
        chmod +x "$APPDIR/AppRun"

        # Create root-level symlinks (AppImage conventions)
        ln -sf usr/share/icons/hicolor/256x256/apps/rogue-signal-protocol.png "$APPDIR/.DirIcon"
        ln -sf usr/share/icons/hicolor/256x256/apps/rogue-signal-protocol.png "$APPDIR/rogue-signal-protocol.png"
        cp "$APPDIR/usr/share/applications/rogue-signal-protocol.desktop" "$APPDIR/rogue-signal-protocol.desktop"

        # Download appimagetool
        wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
        chmod +x appimagetool-x86_64.AppImage

        # Build the AppImage (use --appimage-extract-and-run to avoid FUSE requirement on GitHub runners)
        ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run "$APPDIR" "RogueSignalProtocol-${VERSION}-x86_64.AppImage"

        # Verify AppImage was created
        if [ ! -f "RogueSignalProtocol-${VERSION}-x86_64.AppImage" ]; then
          echo "Failed to create AppImage!"
          exit 1
        fi

        size=$(du -h "RogueSignalProtocol-${VERSION}-x86_64.AppImage" | cut -f1)
        echo "AppImage created: $size"

    - name: Upload tarball release asset
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'release'
      with:
        files: RogueSignalProtocol-*-Linux.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload AppImage release asset
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'release'
      with:
        files: RogueSignalProtocol-*-x86_64.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts (for workflow_dispatch)
      uses: actions/upload-artifact@v4
      if: github.event_name == 'workflow_dispatch'
      with:
        name: linux-build
        path: |
          RogueSignalProtocol-*-Linux.tar.gz
          RogueSignalProtocol-*-x86_64.AppImage

  # Push to itch.io using butler (only on release, requires BUTLER_API_KEY secret)
  push-itch:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: github.event_name == 'release' && vars.ENABLE_ITCH_PUSH == 'true'

    steps:
    - name: Get version from tag
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Pushing version $VERSION to itch.io"

    - name: Download release assets
      run: |
        mkdir -p releases
        gh release download "${{ github.ref_name }}" --dir releases/
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install butler
      run: |
        curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
        unzip butler.zip
        chmod +x butler
        ./butler -V

    - name: Push Windows build to itch.io
      run: |
        ./butler push releases/RogueSignalProtocol-*-Windows.zip \
          dragynrain/rogue-signal-protocol:windows \
          --userversion "${{ env.VERSION }}"
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

    - name: Push Linux tarball to itch.io
      run: |
        ./butler push releases/RogueSignalProtocol-*-Linux.tar.gz \
          dragynrain/rogue-signal-protocol:linux \
          --userversion "${{ env.VERSION }}"
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

    - name: Push AppImage to itch.io
      run: |
        ./butler push releases/RogueSignalProtocol-*-x86_64.AppImage \
          dragynrain/rogue-signal-protocol:linux-appimage \
          --userversion "${{ env.VERSION }}"
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

    - name: Verify itch.io status
      run: |
        ./butler status dragynrain/rogue-signal-protocol
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
