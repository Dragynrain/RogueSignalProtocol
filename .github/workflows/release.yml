name: Build Release

# Only run when a new release is created
on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true  # Enable Git LFS for large asset files

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'  # Use latest stable Python 3.x

    - name: Verify required files
      run: |
        # Check that all required files exist
        $missing = @()

        if (-not (Test-Path "RogueSignalProtocol.py")) { $missing += "RogueSignalProtocol.py" }
        if (-not (Test-Path "requirements.txt")) { $missing += "requirements.txt" }
        if (-not (Test-Path "game_content.json")) { $missing += "game_content.json" }
        if (-not (Test-Path "game_rules.json")) { $missing += "game_rules.json" }
        if (-not (Test-Path "graphics_tiles.json")) { $missing += "graphics_tiles.json" }
        if (-not (Test-Path "narrative_content.json")) { $missing += "narrative_content.json" }
        if (-not (Test-Path "KreativeSquare.ttf")) { $missing += "KreativeSquare.ttf" }
        if (-not (Test-Path "graphics")) { $missing += "graphics/" }
        if (-not (Test-Path "sound")) { $missing += "sound/" }
        if (-not (Test-Path "music")) { $missing += "music/" }

        if ($missing.Count -gt 0) {
          Write-Error "Missing required files: $($missing -join ', ')"
          exit 1
        }

        Write-Host "All required files found."
      shell: powershell

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name RogueSignalProtocol RogueSignalProtocol.py

        # Create debug_mode.flag for alpha releases (enable verbose logging for bug reports)
        # Comment out the next two lines for production release builds
        Write-Host "Creating debug_mode.flag for alpha/beta testing..."
        "This file enables DEBUG logging for playtester bug reports." | Out-File -FilePath "dist\debug_mode.flag" -Encoding ASCII
      shell: powershell

    - name: Verify executable was created
      run: |
        if (-not (Test-Path "dist\RogueSignalProtocol.exe")) {
          Write-Error "Build failed - executable not found!"
          exit 1
        }
        Write-Host "Executable created successfully."
      shell: powershell

    - name: Copy assets to dist
      run: |
        # Copy JSON config files
        Write-Host "Copying JSON config files..."
        Copy-Item -Path "game_content.json" -Destination "dist\"
        Copy-Item -Path "game_rules.json" -Destination "dist\"
        Copy-Item -Path "graphics_tiles.json" -Destination "dist\"
        Copy-Item -Path "narrative_content.json" -Destination "dist\"

        # Copy font file
        Write-Host "Copying font file..."
        Copy-Item -Path "KreativeSquare.ttf" -Destination "dist\"

        # Copy LICENSE if it exists
        if (Test-Path "LICENSE") {
          Write-Host "Copying LICENSE..."
          Copy-Item -Path "LICENSE" -Destination "dist\"
        }

        # Copy README
        Write-Host "Copying distribution README..."
        Copy-Item -Path "README.txt" -Destination "dist\README.txt"

        # Create build info
        Write-Host "Creating build info..."
        "Build Type: Alpha (GitHub Actions)" | Out-File -FilePath "dist\build_info.txt" -Encoding ASCII
        "Log Level: DEBUG" | Add-Content -Path "dist\build_info.txt"
        "Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Add-Content -Path "dist\build_info.txt"

        # Copy asset folders
        Write-Host "Copying graphics folder..."
        Copy-Item -Path "graphics" -Destination "dist\graphics" -Recurse

        Write-Host "Copying sound folder..."
        Copy-Item -Path "sound" -Destination "dist\sound" -Recurse

        Write-Host "Copying music folder..."
        Copy-Item -Path "music" -Destination "dist\music" -Recurse

        Write-Host "All assets copied successfully."
      shell: powershell

    - name: Create release archive
      run: |
        Compress-Archive -Path dist\* -DestinationPath RogueSignalProtocol-Windows.zip -Force

        # Verify zip was created
        if (-not (Test-Path "RogueSignalProtocol-Windows.zip")) {
          Write-Error "Failed to create release archive!"
          exit 1
        }

        $zipSize = (Get-Item "RogueSignalProtocol-Windows.zip").Length / 1MB
        Write-Host "Release archive created: $([math]::Round($zipSize, 2)) MB"
      shell: powershell

    - name: Upload release asset
      uses: softprops/action-gh-release@v1
      with:
        files: RogueSignalProtocol-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev

    - name: Verify required files
      run: |
        missing=""
        [ ! -f "RogueSignalProtocol.py" ] && missing="$missing RogueSignalProtocol.py"
        [ ! -f "requirements.txt" ] && missing="$missing requirements.txt"
        [ ! -f "game_content.json" ] && missing="$missing game_content.json"
        [ ! -f "game_rules.json" ] && missing="$missing game_rules.json"
        [ ! -f "graphics_tiles.json" ] && missing="$missing graphics_tiles.json"
        [ ! -f "narrative_content.json" ] && missing="$missing narrative_content.json"
        [ ! -f "KreativeSquare.ttf" ] && missing="$missing KreativeSquare.ttf"
        [ ! -d "graphics" ] && missing="$missing graphics/"
        [ ! -d "sound" ] && missing="$missing sound/"
        [ ! -d "music" ] && missing="$missing music/"

        if [ -n "$missing" ]; then
          echo "Missing required files:$missing"
          exit 1
        fi
        echo "All required files found."

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable with PyInstaller
      run: |
        pyinstaller RogueSignalProtocol-linux.spec

        # Create debug_mode.flag for alpha builds
        echo "This file enables DEBUG logging for playtester bug reports." > dist/debug_mode.flag

    - name: Verify executable was created
      run: |
        if [ ! -f "dist/RogueSignalProtocol" ]; then
          echo "Build failed - executable not found!"
          exit 1
        fi
        chmod +x dist/RogueSignalProtocol
        echo "Executable created successfully."

    - name: Copy assets to dist
      run: |
        # Copy JSON config files
        echo "Copying JSON config files..."
        cp game_content.json dist/
        cp game_rules.json dist/
        cp graphics_tiles.json dist/
        cp narrative_content.json dist/

        # Copy font file
        echo "Copying font file..."
        cp KreativeSquare.ttf dist/

        # Copy LICENSE if it exists
        if [ -f "LICENSE" ]; then
          echo "Copying LICENSE..."
          cp LICENSE dist/
        fi

        # Copy README
        echo "Copying distribution README..."
        cp README.txt dist/README.txt

        # Create build info
        echo "Creating build info..."
        echo "Build Type: Alpha (GitHub Actions - Linux)" > dist/build_info.txt
        echo "Log Level: DEBUG" >> dist/build_info.txt
        echo "Build Date: $(date '+%Y-%m-%d %H:%M:%S')" >> dist/build_info.txt

        # Copy asset folders
        echo "Copying graphics folder..."
        cp -r graphics dist/

        echo "Copying sound folder..."
        cp -r sound dist/

        echo "Copying music folder..."
        cp -r music dist/

        echo "All assets copied successfully."

    - name: Create release archive
      run: |
        cd dist
        tar -czvf ../RogueSignalProtocol-Linux.tar.gz *
        cd ..

        if [ ! -f "RogueSignalProtocol-Linux.tar.gz" ]; then
          echo "Failed to create release archive!"
          exit 1
        fi

        size=$(du -h RogueSignalProtocol-Linux.tar.gz | cut -f1)
        echo "Release archive created: $size"

    - name: Upload release asset
      uses: softprops/action-gh-release@v1
      with:
        files: RogueSignalProtocol-Linux.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
